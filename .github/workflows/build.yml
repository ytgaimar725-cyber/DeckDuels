name: DeckDuels Build & Deploy

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release
  PROJECT_NAME: DeckDuels

jobs:
  # ──────────────────────────────────────────────
  # BUILD & TEST
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        include:
          - os: windows-latest
            rid: win-x64
            artifact_suffix: windows
          - os: ubuntu-latest
            rid: linux-x64
            artifact_suffix: linux
          - os: macos-latest
            rid: osx-x64
            artifact_suffix: macos

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: 📦 Restore NuGet Packages
        run: dotnet restore ${{ env.PROJECT_NAME }}.csproj --runtime ${{ matrix.rid }}

      - name: 🔨 Build Project
        run: |
          dotnet build ${{ env.PROJECT_NAME }}.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime ${{ matrix.rid }} \
            --no-restore \
            -p:PublishReadyToRun=true \
            -p:PublishSingleFile=true

      - name: 🧪 Run Unit Tests (if any)
        continue-on-error: true
        run: dotnet test --no-build --configuration ${{ env.CONFIGURATION }} --logger "trx;LogFileName=test-results.trx"

      - name: 📤 Publish Self-Contained
        run: |
          dotnet publish ${{ env.PROJECT_NAME }}.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/${{ matrix.artifact_suffix }}

      - name: 📦 Create Release Archive
        if: matrix.os != 'windows-latest'
        run: |
          cd ./publish/${{ matrix.artifact_suffix }}
          tar -czf ../../${{ env.PROJECT_NAME }}-${{ matrix.artifact_suffix }}.tar.gz .

      - name: 📦 Create Release Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ./publish/${{ matrix.artifact_suffix }}/* -DestinationPath ./${{ env.PROJECT_NAME }}-${{ matrix.artifact_suffix }}.zip

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.artifact_suffix }}
          path: |
            ./${{ env.PROJECT_NAME }}-${{ matrix.artifact_suffix }}.tar.gz
            ./${{ env.PROJECT_NAME }}-${{ matrix.artifact_suffix }}.zip
          retention-days: 30

  # ──────────────────────────────────────────────
  # CODE QUALITY & SECURITY
  # ──────────────────────────────────────────────
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔍 Restore
        run: dotnet restore

      - name: 🧹 Code Style Check
        run: |
          dotnet format --verify-no-changes --verbosity diagnostic || echo "Formatting issues found"

      - name: 🔒 Security Scan
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: 🔬 Analyze
        run: dotnet build --no-restore

      - name: 📊 CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ──────────────────────────────────────────────
  # RELEASE
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 🏷️ Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 📢 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ env.PROJECT_NAME }} ${{ steps.version.outputs.VERSION }}
          body: |
            # DeckDuels ${{ steps.version.outputs.VERSION }}

            ## 🎮 Download

            - **Windows**: `DeckDuels-windows.zip`
            - **Linux**: `DeckDuels-linux.tar.gz`
            - **macOS**: `DeckDuels-macos.tar.gz`

            ## ✨ Features

            - 3D First-Person Card Game Experience
            - Weight Accumulation / Tug-of-War Mechanic
            - 60-Second Countdown Matches
            - Online Leaderboard Integration
            - Live Spectator Mode

            ## 📋 Full Changelog
            https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: ./artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # NOTIFY DISCORD
  # ──────────────────────────────────────────────
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [build, release]
    if: always() && (needs.build.result == 'success' || needs.release.result == 'success')
    steps:
      - name: 📢 Discord Webhook
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🎮 **DeckDuels Build Status**
            - Build: ${{ needs.build.result }}
            - Release: ${{ needs.release.result }}
            - Commit: ${{ github.event.head_commit.message }}
            - Branch: ${{ github.ref_name }}
