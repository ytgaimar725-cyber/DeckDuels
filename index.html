<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeckDuels - 3D Overload</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <header>
            <h1>DECK DUELS</h1>
            <p class="subtitle">3D Table Arena</p>
        </header>

        <div class="dashboard">
            <div class="timer-box">
                <span id="time-display">60s</span>
            </div>
            <div class="status-box">
                <span id="status-text">Table active. Play your hand or get overloaded!</span>
            </div>
        </div>

        <div class="scale-section">
            <div class="scale-labels">
                <span>Safe Zone</span>
                <span id="weight-value">Table Weight: 50 / 100</span>
                <span>Overload</span>
            </div>
            <div class="progress-container">
                <div id="scale-bar" class="progress-fill"></div>
            </div>
        </div>

        <div class="card-action-area">
            <button id="btn-play-card" class="neon-btn">Play Card (+10 Weight)</button>
            <button id="btn-restart" class="neon-btn secondary" style="display:none;">Restart Match</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
